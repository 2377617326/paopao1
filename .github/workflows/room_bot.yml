name: Room Scheduler 定时任务

on:
  schedule:
    # UTC 时间: 每 2 小时触发一次
    # 新job启动时自动取消旧job并接管房间, 无空档
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: room-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 运行自动调度器
        env:
          BOT_USER: ${{ secrets.BOT_USER }}
          BOT_PASS: ${{ secrets.BOT_PASS }}
        run: |
          python room_scheduler.py --login "$BOT_USER" "$BOT_PASS"

      - name: 自动重启(全天运行, 夜间检查遗漏房间)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 全天24小时都重启: 08:00-22:00 建房+处理房间,
          # 22:00-08:00 不建房, 仅检查并处理遗漏(未结束)房间
          echo "北京时间 $(($(( $(date -u +%H) + 8) % 24 ))):00, 30秒后自动重启..."
          sleep 30
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/room_bot.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "已触发新run"
