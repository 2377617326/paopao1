name: Room Scheduler

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: room-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scheduler
        env:
          BOT_USER: ${{ secrets.BOT_USER }}
          BOT_PASS: ${{ secrets.BOT_PASS }}
        run: python room_scheduler.py --login "$BOT_USER" "$BOT_PASS"

      - name: Auto restart
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOUR_BJ=$(( ($(date -u +%%H) + 8) %% 24 ))
          echo "BJ time ${HOUR_BJ}:00, restart in 30s..."
          sleep 30
          curl -s -X POST             -H "Authorization: token $GH_TOKEN"             -H "Accept: application/vnd.github.v3+json"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/room_bot.yml/dispatches"             -d '"'"'{"ref":"main"}'"'"'
          echo "triggered"
