name: Room Scheduler 定时任务

on:
  schedule:
    # UTC 时间: 每 2 小时触发一次
    # 新job启动时自动取消旧job并接管房间, 无空档
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: room-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 运行自动调度器
        env:
          BOT_USER: ${{ secrets.BOT_USER }}
          BOT_PASS: ${{ secrets.BOT_PASS }}
        run: |
          python room_scheduler.py --login "$BOT_USER" "$BOT_PASS"
