name: Room Scheduler 定时任务

on:
  schedule:
    # UTC 时间: 每 6 小时触发一次 (GitHub Actions 免费 job 上限 6 小时)
    # 0:00 UTC = 北京 8:00, 6:00 UTC = 北京 14:00, 12:00 UTC = 北京 20:00, 18:00 UTC = 北京 次日 02:00
    # 调度器会自动接管进行中的房间, 跨 job 无缝继续
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:   # 允许手动触发

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 运行自动调度器
        env:
          BOT_USER: ${{ secrets.BOT_USER }}
          BOT_PASS: ${{ secrets.BOT_PASS }}
        run: |
          python room_scheduler.py --login "$BOT_USER" "$BOT_PASS"