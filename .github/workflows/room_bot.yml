name: Room Bot 定时任务

on:
  schedule:
    # UTC 时间, 每天 06:00 和 18:00 运行 (北京 14:00 / 次日 02:00)
    # 按需修改 cron 表达式
    - cron: '0 6,18 * * *'
  workflow_dispatch:   # 允许手动触发

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 运行房间自动化
        env:
          BOT_USER: ${{ secrets.BOT_USER }}
          BOT_PASS: ${{ secrets.BOT_PASS }}
        run: |
          python room_bot.py --login "$BOT_USER" "$BOT_PASS" --create --monitor \
            --min-players 3 --max-wait 3600 --poll-interval 30